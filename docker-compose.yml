services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: enem
      POSTGRES_USER: enem
      POSTGRES_PASSWORD: enem
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enem -d enem"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  postgres_data:
