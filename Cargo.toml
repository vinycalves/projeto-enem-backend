[package]
name = "enem-backend"
version = "0.1.0"
edition = "2024"
default-run = "enem-backend"
license = "MIT"
description = "API gratuita de estudos para o ENEM"
repository = "https://github.com/vinycius/projeto-enem-backend"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5.3"
rand = "0.8.5"
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.18", features = ["v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
dotenvy = "0.15.7"
thiserror = "2.0.17"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5.48", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.3"
